[project]
name = "ks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.6",
    "markdownify>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
ks = "ks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
